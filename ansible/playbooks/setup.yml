---
- name: Configuração Inicial das VMs do Laboratório de Dados
  hosts: all
  become: yes
  tasks:
    - name: Atualizar o cache do gerenciador de pacotes APT
      apt:
        update_cache: yes

    - name: Instalar dependências essenciais do sistema
      apt:
        name:
          - git
          - curl
          - python3-pip
          - python3-venv
          - docker.io
        state: present

    - name: Criar diretórios de trabalho padronizados
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/fca/simulator
        - /opt/fca/data/raw
        - /opt/fca/data/processed
        - /opt/fca/logs