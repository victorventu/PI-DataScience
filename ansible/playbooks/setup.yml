---
- name: Configuração Inicial das VMs do Laboratório de Dados
  hosts: all
  become: yes
  tasks:
    - name: Configurar rota padrão e DNS externo nas VMs
      shell: |
        ip route add default via 192.168.122.1 metric 100 2>/dev/null || true
        systemctl stop systemd-resolved || true
        systemctl disable systemd-resolved || true
        rm -f /etc/resolv.conf
        echo "nameserver 8.8.8.8" > /etc/resolv.conf
      args:
        executable: /bin/bash

    - name: Garantir configuração de IPv4 para o APT
      copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99force-ipv4

    - name: Limpar CD-ROMs, remover ubuntu.sources e configurar sources.list clássico com espera de lock
      shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 3
        done
        sed -i '/cdrom:/d' /etc/apt/sources.list 2>/dev/null || true
        rm -f /etc/apt/sources.list.d/ubuntu.sources
        cat <<EOF > /etc/apt/sources.list
        deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu/ noble-backports main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu/ noble-security main restricted universe multiverse
        EOF
        apt-get clean
        apt-get update -y
      args:
        executable: /bin/bash

    - name: Instalar dependências essenciais do sistema (todas as VMs)
      apt:
        name:
          - git
          - curl
          - python3-pip
          - python3-venv
          - docker.io
        state: present
        update_cache: yes

    - name: Instalar bibliotecas do Python para o Simulador (apenas na VM do Simulador)
      apt:
        name:
          - python3-pandas
        state: present
      when: inventory_hostname in groups['simulator']

    - name: Instalar R (apenas na VM de ETL)
      apt:
        name:
          - r-base
        state: present
      when: inventory_hostname in groups['etl']

    - name: Garantir que o serviço Docker está ativo e habilitado
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuário ao grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Criar diretórios de trabalho padronizados
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/fca/simulator
        - /opt/fca/data/raw
        - /opt/fca/data/processed
        - /opt/fca/logs

    - name: Copiar código do simulador automaticamente para a VM do Simulador
      copy:
        src: "../../simulator/"
        dest: "/opt/fca/simulator/"
      when: inventory_hostname in groups['simulator']
      
    - name: Configurar execução automática do simulador por Cron (a cada hora)
      shell: |
        (crontab -l 2>/dev/null | grep -F "gerador.py") || (crontab -l 2>/dev/null; echo "0 * * * * python3 /opt/fca/simulator/gerador.py --output /opt/fca/data/raw") | crontab -
      when: inventory_hostname in groups['simulator']
      args:
        executable: /bin/bash