---
- name: Configuração Inicial das VMs do Laboratório de Dados
  hosts: all
  become: yes
  tasks:
    - name: Configurar rota padrão e DNS externo nas VMs
      shell: |
        ip route add default via 192.168.122.1 metric 100 2>/dev/null || true
        systemctl stop systemd-resolved || true
        systemctl disable systemd-resolved || true
        rm -f /etc/resolv.conf
        echo "nameserver 8.8.8.8" > /etc/resolv.conf
      args:
        executable: /bin/bash

    - name: Garantir configuração de IPv4 para o APT
      copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99force-ipv4

    - name: Limpar CD-ROMs, remover ubuntu.sources e configurar sources.list clássico com espera de lock
      shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 3
        done
        sed -i '/cdrom:/d' /etc/apt/sources.list 2>/dev/null || true
        rm -f /etc/apt/sources.list.d/ubuntu.sources
        cat <<EOF > /etc/apt/sources.list
        deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu/ noble-backports main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu/ noble-security main restricted universe multiverse
        EOF
        apt-get clean
        apt-get update -y
      args:
        executable: /bin/bash

    - name: Instalar dependências essenciais do sistema (todas as VMs)
      apt:
        name:
          - git
          - curl
          - python3-pip
          - python3-venv
          - docker.io
        state: present
        update_cache: yes

    - name: Instalar bibliotecas do Python para o Simulador (apenas na VM do Simulador)
      apt:
        name:
          - python3-pandas
        state: present
      when: inventory_hostname in groups['simulator']

    - name: Instalar R (apenas na VM de ETL)
      apt:
        name:
          - r-base
        state: present
      when: inventory_hostname in groups['etl']

    - name: Garantir que o serviço Docker está ativo e habilitado
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuário ao grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Criar diretórios de trabalho padronizados
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/fca/simulator
        - /opt/fca/etl
        - /opt/fca/data/raw
        - /opt/fca/data/processed
        - /opt/fca/logs

    - name: Copiar código do simulador automaticamente para a VM do Simulador
      copy:
        src: "../../../simulator/"
        dest: "/opt/fca/simulator/"
      when: inventory_hostname in groups['simulator']

    - name: Instalar dependência Faker via pip (apenas na VM do Simulador)
      pip:
        name:
          - faker
        executable: pip3
        extra_args: --break-system-packages
      when: inventory_hostname in groups['simulator']

    - name: Instalar Docker e Docker Compose (apenas na VM de Monitoramento)
      apt:
        name:
          - docker-compose
          - docker.io
        state: present
        update_cache: yes
      when: inventory_hostname in groups['monitoring']

    - name: Garantir que o serviço Docker está ativo e habilitado (apenas na VM de Monitoramento)
      systemd:
        name: docker
        state: started
        enabled: true
      when: inventory_hostname in groups['monitoring']

    - name: Instalar Java (JRE) para o Big Data (apenas na VM Big Data)
      apt:
        name: default-jre
        state: present
        update_cache: yes
      when: inventory_hostname in groups['bigdata']

    - name: Copiar código R para a VM de ETL
      copy:
        src: "../../../etl/tratamento.R"
        dest: "/opt/fca/etl/tratamento.R"
        mode: '0755'
        owner: "{{ ansible_user }}"
      when: inventory_hostname in groups['etl']

    - name: Gerar chave SSH no Simulador
      user:
        name: "{{ ansible_user }}"
        generate_ssh_key: yes
        ssh_key_bits: 2048
        ssh_key_file: .ssh/id_rsa
      when: inventory_hostname in groups['simulator']

    - name: Ler chave pública do Simulador
      slurp:
        src: "/home/{{ ansible_user }}/.ssh/id_rsa.pub"
      register: sim_key
      when: inventory_hostname in groups['simulator']

    - name: Autorizar chave do Simulador na ETL
      authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ hostvars[groups['simulator'][0]]['sim_key']['content'] | b64decode }}"
      when: inventory_hostname in groups['etl']

    - name: Gerar chave SSH na ETL
      user:
        name: "{{ ansible_user }}"
        generate_ssh_key: yes
        ssh_key_bits: 2048
        ssh_key_file: .ssh/id_rsa
      when: inventory_hostname in groups['etl']

    - name: Ler chave pública da ETL
      slurp:
        src: "/home/{{ ansible_user }}/.ssh/id_rsa.pub"
      register: etl_key
      when: inventory_hostname in groups['etl']

    - name: Autorizar chave da ETL no Big Data
      authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ hostvars[groups['etl'][0]]['etl_key']['content'] | b64decode }}"
      when: inventory_hostname in groups['bigdata']

    - name: Criar script do pipeline na VM Simulador
      template:
        src: "pipeline.sh.j2"
        dest: "/opt/fca/simulator/pipeline.sh"
        mode: '0755'
        owner: "{{ ansible_user }}"
      when: inventory_hostname in groups['simulator']

    - name: Configurar execução automática do PIPELINE por Cron (a cada hora)
      cron:
        name: "Pipeline de Dados FCA"
        minute: "0"
        job: "bash /opt/fca/simulator/pipeline.sh >> /opt/fca/logs/pipeline.log 2>&1"
        user: "{{ ansible_user }}"
      when: inventory_hostname in groups['simulator']

    - name: Copiar script de tratamento R para a vm-etl
      copy:
        src: ../../../etl/tratamento.R
        dest: /opt/fca/etl/tratamento.R
        mode: '0755'
      when: inventory_hostname == 'vm-etl'